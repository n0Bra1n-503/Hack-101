version: "3.8"

services:
  skyguard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skyguard-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./skyguard.db}
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # Optional persistent volume for SQLite local storage if not using cloud PostgreSQL
    volumes:
      - skyguard_data:/app/data/processed

volumes:
  skyguard_data:
